# Escáner de secretos (capa 1 del departamento de IT).
# Revisa los commits nuevos de cada push y de cada PR con gitleaks y marca la
# comprobación en rojo si encuentra una clave, un webhook, un certificado o una
# contraseña. Solo revisa lo nuevo: lo que ya estaba en el historial se trata aparte.
name: Escáner de secretos

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "$base/$file"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          tar -xzf "$file" gitleaks
          rm -f "$file" checksums.txt

      - name: Calcular qué commits revisar
        id: rango
        env:
          EVENTO: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          ANTES: ${{ github.event.before }}
          DESPUES: ${{ github.sha }}
          RAMA_PRINCIPAL: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENTO" = "pull_request" ]; then
            rango="$PR_BASE..$PR_HEAD"
          elif [ "$EVENTO" = "push" ] && [ -n "$ANTES" ] && ! echo "$ANTES" | grep -q '^0*$' && git cat-file -e "$ANTES" 2>/dev/null; then
            rango="$ANTES..$DESPUES"
          elif git rev-parse -q --verify "origin/$RAMA_PRINCIPAL" >/dev/null && [ "$(git rev-parse "origin/$RAMA_PRINCIPAL")" != "$DESPUES" ]; then
            # Rama nueva: lo que tiene que no esté en la rama principal.
            rango="origin/$RAMA_PRINCIPAL..$DESPUES"
          else
            # Ejecución manual o primer push: el último commit.
            rango="$DESPUES~1..$DESPUES"
            git cat-file -e "$DESPUES~1" 2>/dev/null || rango="$DESPUES"
          fi
          echo "Commits revisados: $rango"
          echo "rango=$rango" >> "$GITHUB_OUTPUT"

      - name: Buscar secretos
        env:
          RANGO: ${{ steps.rango.outputs.rango }}
        run: |
          config=""
          [ -f .gitleaks.toml ] && config="--config .gitleaks.toml"
          if ./gitleaks git . $config --log-opts="$RANGO" --redact --no-banner --verbose; then
            echo "✅ No se han encontrado secretos." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## 🔴 Se ha encontrado un posible secreto"
              echo
              echo "Arriba, en el registro de este paso, está el archivo y la línea (la clave aparece tapada)."
              echo
              echo "1. Quita la clave del código y ponla en una variable de Railway."
              echo "2. Si el commit ya se ha subido, **considera la clave expuesta y rótala** (ver docs/manual-incidentes.md en it-department)."
              echo "3. Si es un falso positivo, pide a Claude Code que lo añada a las excepciones de .gitleaks.toml."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
